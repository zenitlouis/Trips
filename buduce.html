<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Miesto pre budúci výlet.">
  <title>Budúce výlety</title>
  <style>
    :root{--ink:#17231d;--muted:#66736c;--cream:#f6f1e7;--card:#fffdf8;--green:#294d3a;--gold:#c98f3c;--line:#ded7c8}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--cream);color:var(--ink)}
    main{width:min(680px,calc(100% - 32px));padding:48px;border:1px solid var(--line);border-radius:28px;background:var(--card);box-shadow:0 18px 45px #1b352518}
    .eyebrow{color:var(--gold);font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
    h1{margin:12px 0 16px;font-size:clamp(42px,9vw,72px);line-height:1;letter-spacing:-.04em}
    p{margin:0 0 30px;color:var(--muted);font-size:18px;line-height:1.6}
    a{display:inline-flex;align-items:center;gap:8px;padding:13px 18px;border-radius:12px;background:var(--green);color:white;font-weight:800;text-decoration:none}
    a:hover{filter:brightness(1.12)}
    a:focus-visible{outline:4px solid var(--gold);outline-offset:4px}
    @media(max-width:600px){main{padding:32px 24px}}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Pripravujeme</div>
    <h1>Budúce výlety</h1>
    <p>Sem postupne pribudne ďalší itinerár. Táto stránka zároveň overuje, že GitHub plugin dokáže vytvoriť a publikovať nový obsah.</p>
    <a href="index.html">← Späť na všetky výlety</a>
  </main>
</body>
</html>
